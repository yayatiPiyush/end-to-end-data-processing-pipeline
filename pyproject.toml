[project]
name = "ecommerce-pipeline"
version = "1.0.0"
description = "Reliable, idempotent batch pipeline for e-commerce orders and customers"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
