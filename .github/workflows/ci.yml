name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov=pipeline
      - name: Sample data is reproducible
        run: python scripts/generate_sample_data.py && git diff --exit-code data/raw
      - name: Pipeline runs end to end, twice
        run: |
          python -m pipeline --as-of 2026-10-21
          python -m pipeline --as-of 2026-10-21
